<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de login del sitio web de práctica HTML">
    <title>Inicio de Sesión - Mi Sitio Web</title>
</head>
<body>

    <header>
        <h1>Mi Sitio Web de Práctica</h1>
        <p>Bienvenido, por favor inicia sesión para continuar.</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a> |
        <a href="tags.html">Etiquetas HTML</a> |
        <a href="profile.html">Perfil</a>
    </nav>

    <div>
        <h2>Iniciar Sesión</h2>

        <form>
            <p>
                <label for="username">Usuario:</label><br />
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario">
            </p>

            <p>
                <label for="password">Contraseña:</label><br />
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
            </p>

            <p>
                <strong>Nota:</strong> Todos los campos son obligatorios.
            </p>

            <button type="submit">Ingresar</button>
        </form>


    </div>


</body>
</html>
